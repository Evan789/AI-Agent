<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大气环境诊断助手</title>
<style>
  :root {
    --ink: #16321a;
    --moss: #1b5e20;
    --moss-2: #2e7d32;
    --paper: #f4f1e8;
    --card: #fffdf7;
    --line: #d7cfc0;
    --mute: #6b6458;
    --user: #1b3a4b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 500px at 10% -10%, #dceee0 0%, transparent 55%),
      var(--paper);
    color: var(--ink);
  }
  .shell {
    max-width: 760px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 0.04em; }
  header p { margin: 6px 0 0; font-size: 12px; color: var(--mute); }
  #log {
    flex: 1;
    overflow: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 92%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; line-height: 1.55; font-size: 14px; }
  .user { align-self: flex-end; background: var(--user); color: #f4fbff; }
  .bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .meta { align-self: flex-start; font-size: 11px; color: var(--mute); margin-top: -6px; }
  form {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    padding: 12px 20px 18px;
    border-top: 1px solid var(--line);
    background: rgba(255,253,247,0.8);
  }
  textarea {
    grid-column: 1 / -1;
    min-height: 72px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    font: inherit;
    background: var(--card);
  }
  label { font-size: 12px; color: var(--mute); display: flex; align-items: center; gap: 6px; }
  select {
    grid-column: 1 / -1;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    font: inherit;
    background: var(--card);
    color: var(--ink);
  }
  button {
    background: linear-gradient(180deg, var(--moss-2), var(--moss));
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 8px 16px;
    cursor: pointer;
    font: inherit;
  }
  button:disabled { opacity: 0.55; cursor: wait; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>大气环境诊断助手</h1>
    <p>与命令行共用会话。下拉可指定分析器，留空则按问题自动选；勾选后由 DeepSeek 写摘要（需 VPN）。</p>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="q" placeholder="分析南昌 2026-03-10 到 2026-03-20 的跷跷板" required></textarea>
    <select id="skill" aria-label="分析器">
      <option value="">按问题自动选择</option>
      <option value="all">全部 11 项</option>
    </select>
    <label><input type="checkbox" id="llm" checked /> DeepSeek 摘要</label>
    <button type="submit" id="go">发送</button>
  </form>
</div>
<script>
const log = document.getElementById("log");
const form = document.getElementById("f");
const q = document.getElementById("q");
const llm = document.getElementById("llm");
const skill = document.getElementById("skill");
const go = document.getElementById("go");

fetch("/api/analyzers").then((r) => r.json()).then((data) => {
  (data.analyzers || []).forEach((a) => {
    const opt = document.createElement("option");
    opt.value = a.id;
    opt.textContent = a.name;
    skill.appendChild(opt);
  });
});

function add(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const goal = q.value.trim();
  if (!goal) return;
  add("user", goal);
  q.value = "";
  go.disabled = true;
  const wait = add("bot", "分析中…");
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({goal, llm: llm.checked, skill: skill.value || null}),
    });
    const data = await res.json();
    wait.textContent = data.message || JSON.stringify(data, null, 2);
    const bits = [];
    if (data.summary_source) bits.push("摘要:" + data.summary_source);
    if (data.ran_now && data.ran_now.length) bits.push("新跑:" + data.ran_now.join(","));
    if (data.reused && data.reused.length) bits.push("复用:" + data.reused.join(","));
    if (bits.length) {
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = bits.join("  ·  ");
      log.appendChild(meta);
    }
  } catch (err) {
    wait.textContent = "请求失败: " + err;
  } finally {
    go.disabled = false;
    log.scrollTop = log.scrollHeight;
  }
});
</script>
</body>
</html>
